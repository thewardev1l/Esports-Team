<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED VORTEX • Loja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #130000;
            --bg-card: #160808;
            --accent: #bb0505;
            --accent-hover: #d90707;
            --text-muted: #C4B5B9;
            --border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: #FFFFFF;
        }
        
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }
        
        /* Navbar igual ao index */
        .nav-link {
            position: relative;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: var(--accent-hover);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        /* Logo glow */
        .logo-glow {
            transition: filter 0.3s ease;
        }
        
        .logo-glow:hover {
            filter: drop-shadow(0 0 15px rgba(187, 5, 5, 0.5));
        }
        
        /* Cards produto */
        .product-card {
            background-color: var(--bg-card);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .product-card.animate-in {
            opacity: 1;
            transform: translateY(0);
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 50px -12px rgba(187, 5, 5, 0.35);
        }
        
        .product-card:hover .product-image {
            transform: scale(1.05);
        }
        
        .product-image {
            transition: transform 0.5s ease;
        }
        
        /* Botão accent */
        .btn-accent {
            background-color: var(--accent);
            transition: all 0.3s ease;
        }
        
        .btn-accent:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(187, 5, 5, 0.4);
        }
        
        /* Carrinho */
        .cart-drawer {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .cart-drawer.open {
            transform: translateX(0);
        }
        
        .cart-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Menu mobile */
        .mobile-menu {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 90;
            padding-top: 80px;
        }
        
        .mobile-menu.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 200;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <!-- ============================================
         NAVBAR - EXATAMENTE IGUAL AO INDEX.HTML
         ============================================ -->
    <nav class="bg-[var(--bg)] border-b border-white/10 sticky top-0 z-50">
        <div class="w-full max-w-screen-2xl mx-auto px-6 md:px-8 py-4">
            <div class="flex items-center justify-between w-full">
            
                <!-- Esquerda: Logo + Menu -->
                <div class="flex items-center gap-x-8">
                    <a href="index.html" class="flex items-center shrink-0 logo-glow">
                        <img src="images/redvortex2.png" alt="Red Vortex Logo" class="h-10 w-auto">
                    </a>
                
                    <!-- Menu Desktop -->
                    <div class="hidden md:flex items-center gap-x-7 text-base font-semibold tracking-[2px] uppercase">
                        <a href="index.html#sobre" class="nav-link transition-colors">SOBRE</a>
                        <a href="index.html#elenco" class="nav-link transition-colors">ELENCO</a>
                        <span class="text-[var(--accent)]">LOJA</span>
                    </div>
                    
                    <!-- Botão Menu Mobile -->
                    <button id="menu-toggle" class="md:hidden text-2xl text-white hover:text-[var(--accent)] transition-colors">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>

                <!-- Direita: Redes Sociais + Carrinho -->
                <div class="flex items-center gap-x-5 text-xl text-white/90">
                    <!-- Redes sociais -->
                    <a href="https://x.com/seuusuario" target="_blank" class="hover:text-[var(--accent-hover)] transition-colors" aria-label="X / Twitter">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <a href="https://instagram.com/seuusuario" target="_blank" class="hover:text-[var(--accent-hover)] transition-colors" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://discord.gg/seulink" target="_blank" class="hover:text-[var(--accent-hover)] transition-colors" aria-label="Discord">
                        <i class="fa-brands fa-discord"></i>
                    </a>
                    <a href="mailto:contato@dawnesports.com" class="hover:text-[var(--accent-hover)] transition-colors" aria-label="E-mail">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                    
                    <!-- Separador -->
                    <div class="w-px h-6 bg-white/20 mx-2"></div>
                    
                    <!-- Carrinho -->
                    <button onclick="toggleCart()" class="relative hover:text-[var(--accent)] transition-colors">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span id="cart-badge" class="absolute -top-2 -right-2 w-5 h-5 bg-[var(--accent)] text-white text-xs font-bold rounded-full flex items-center justify-center scale-0 transition-transform">0</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Menu Mobile -->
        <div id="mobile-menu" class="mobile-menu">
            <a href="index.html#sobre" class="text-2xl font-bold tracking-wider hover:text-[var(--accent)] transition-colors">SOBRE</a>
            <a href="index.html#elenco" class="text-2xl font-bold tracking-wider hover:text-[var(--accent)] transition-colors">ELENCO</a>
            <span class="text-2xl font-bold tracking-wider text-[var(--accent)]">LOJA</span>
            <div class="flex gap-6 mt-8 text-2xl">
                <a href="https://x.com/seuusuario" target="_blank" class="hover:text-[var(--accent)]"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://instagram.com/seuusuario" target="_blank" class="hover:text-[var(--accent)]"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://discord.gg/seulink" target="_blank" class="hover:text-[var(--accent)]"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>
    </nav>

    <!-- ============================================
         CONTEÚDO DA LOJA
         ============================================ -->
    
    <!-- Hero -->
    <header class="relative py-20 px-6 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-[var(--accent)]/5 to-transparent pointer-events-none"></div>
        
        <div class="max-w-screen-2xl mx-auto relative z-10 text-center">
            <span class="inline-block px-5 py-1.5 rounded-full bg-[var(--accent)]/10 border border-[var(--accent)]/30 text-[var(--accent)] text-sm tracking-widest uppercase mb-6">
                Coleção 2027
            </span>
            <h1 class="font-display text-5xl md:text-7xl font-bold tracking-tighter mb-4">Loja Oficial</h1>
            <p class="text-xl text-[var(--text-muted)] max-w-2xl mx-auto">
                Vista as cores do RED VORTEX. Produtos de qualidade para quem vive a intensidade do competitivo.
            </p>
        </div>
    </header>

    <!-- Produtos -->
    <main class="max-w-screen-2xl mx-auto px-6 pb-24">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Produtos injetados via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 bg-[var(--bg-card)]">
        <div class="max-w-screen-2xl mx-auto px-6 py-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-y-6">
                <div class="text-sm text-[var(--text-muted)]">
                    © 2027 <span class="text-white font-medium">RED VORTEX</span>. Todos os direitos reservados.
                </div>
                <div class="flex items-center gap-x-6 text-xl">
                    <a href="https://x.com/seuusuario" target="_blank" class="text-[var(--text-muted)] hover:text-[var(--accent-hover)] transition-colors">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <a href="https://instagram.com/seuusuario" target="_blank" class="text-[var(--text-muted)] hover:text-[var(--accent-hover)] transition-colors">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://discord.gg/seulink" target="_blank" class="text-[var(--text-muted)] hover:text-[var(--accent-hover)] transition-colors">
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- ============================================
         CARRINHO DRAWER
         ============================================ -->
    <div id="cart-overlay" onclick="toggleCart()" class="cart-overlay fixed inset-0 bg-black/80 backdrop-blur-sm z-50"></div>
    
    <aside id="cart-drawer" class="cart-drawer fixed top-0 right-0 h-full w-full max-w-md bg-[var(--bg-card)] border-l border-[var(--border)] z-50 flex flex-col">
        
        <!-- Header -->
        <div class="flex items-center justify-between p-6 border-b border-[var(--border)]">
            <div class="flex items-center gap-x-3">
                <i class="fa-solid fa-bag-shopping text-[var(--accent)]"></i>
                <h3 class="font-display font-bold text-xl">Seu Carrinho</h3>
                <span id="cart-header-count" class="text-sm text-[var(--text-muted)]">(0 itens)</span>
            </div>
            <button onclick="toggleCart()" class="w-10 h-10 rounded-full hover:bg-white/5 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Items -->
        <div id="cart-items" class="flex-1 overflow-auto p-6 space-y-4">
            <!-- Injetado via JS -->
        </div>

        <!-- Footer -->
        <div class="p-6 border-t border-[var(--border)] bg-[var(--bg)]">
            <div class="flex justify-between items-center mb-6">
                <span class="text-[var(--text-muted)]">Total</span>
                <span id="cart-total" class="font-display font-bold text-2xl text-[var(--accent)]">R$ 0,00</span>
            </div>
            <button onclick="checkout()" id="checkout-btn" class="w-full py-4 btn-accent text-white font-semibold rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed">
                Finalizar Compra
            </button>
        </div>
    </aside>

    <!-- Toast -->
    <div id="toast" class="toast flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-[var(--accent)] text-xl"></i>
        <div>
            <p class="font-medium">Adicionado ao carrinho</p>
            <p id="toast-product" class="text-sm text-[var(--text-muted)]"></p>
        </div>
    </div>

    <!-- ============================================
         JAVASCRIPT
         ============================================ -->
    <script>
        // Dados dos produtos
        const products = [
            { id: 1, name: "Jersey Oficial 2027", price: 149.90, image: "images/jersey2027.jpg", tag: "NOVO" },
            { id: 2, name: "Camiseta Red Vortex", price: 89.90, image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600", tag: null },
            { id: 3, name: "Moletom Oversized", price: 199.90, image: "https://images.unsplash.com/photo-1556821840-3a63f95609b7?w=600", tag: "MAIS VENDIDO" },
            { id: 4, name: "Boné Snapback", price: 69.90, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=600", tag: null },
            { id: 5, name: "Manguito Pro", price: 39.90, image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=600", tag: null },
            { id: 6, name: "Mousepad XL", price: 79.90, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c09e8?w=600", tag: "ESGOTADO", soldOut: true },
            { id: 7, name: "Garrafa Térmica", price: 59.90, image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600", tag: null },
            { id: 8, name: "Kit Adesivos", price: 19.90, image: "https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=600", tag: null }
        ];

        // Estado
        let cart = JSON.parse(localStorage.getItem('vortex_cart')) || [];

        // Menu mobile
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
        });

        document.querySelectorAll('#mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('active');
                menuToggle.querySelector('i').classList.add('fa-bars');
                menuToggle.querySelector('i').classList.remove('fa-xmark');
            });
        });

        // Render produtos
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            
            grid.innerHTML = products.map((product, index) => `
                <div class="product-card border border-[var(--border)] rounded-3xl overflow-hidden group" style="transition-delay: ${index * 0.1}s">
                    <div class="aspect-square overflow-hidden bg-[#1a0a0a] relative">
                        ${product.tag ? `
                            <span class="absolute top-4 left-4 px-3 py-1 text-xs font-bold rounded-full z-10 ${product.tag === 'ESGOTADO' ? 'bg-white/10 text-white/60' : 'bg-[var(--accent)] text-white'}">
                                ${product.tag}
                            </span>
                        ` : ''}
                        <img src="${product.image}" alt="${product.name}" class="product-image w-full h-full object-cover">
                        
                        ${!product.soldOut ? `
                            <button onclick="addToCart(${product.id})" class="absolute bottom-0 left-0 right-0 py-4 bg-[var(--accent)]/90 backdrop-blur-sm text-white font-semibold opacity-0 translate-y-full group-hover:opacity-100 group-hover:translate-y-0 transition-all hover:bg-[var(--accent-hover)]">
                                Adicionar ao Carrinho
                            </button>
                        ` : ''}
                    </div>
                    
                    <div class="p-6">
                        <h3 class="font-semibold text-lg mb-2 group-hover:text-[var(--accent)] transition-colors">${product.name}</h3>
                        <div class="flex items-center justify-between">
                            <span class="font-display font-bold text-xl">R$ ${product.price.toFixed(2)}</span>
                            ${product.soldOut ? 
                                '<span class="text-sm text-[var(--text-muted)]">Indisponível</span>' :
                                `<button onclick="addToCart(${product.id})" class="w-10 h-10 rounded-full bg-white/5 hover:bg-[var(--accent)] flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-plus"></i>
                                </button>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Animação de entrada
            setTimeout(() => {
                document.querySelectorAll('.product-card').forEach(card => {
                    card.classList.add('animate-in');
                });
            }, 100);
        }

        // Carrinho
        function renderCart() {
            const badge = document.getElementById('cart-badge');
            const headerCount = document.getElementById('cart-header-count');
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            // Badge
            badge.textContent = cart.length;
            badge.classList.toggle('scale-100', cart.length > 0);
            headerCount.textContent = `(${cart.length} ${cart.length === 1 ? 'item' : 'itens'})`;
            
            // Items
            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="text-center text-[var(--text-muted)] py-12">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-4 opacity-20"></i>
                        <p>Seu carrinho está vazio</p>
                        <button onclick="toggleCart()" class="mt-4 text-[var(--accent)] hover:underline text-sm">Continuar comprando</button>
                    </div>
                `;
                checkoutBtn.disabled = true;
            } else {
                itemsContainer.innerHTML = cart.map((item, index) => `
                    <div class="flex gap-4 p-4 rounded-2xl bg-[var(--bg)] border border-[var(--border)]">
                        <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl">
                        <div class="flex-1">
                            <h4 class="font-medium">${item.name}</h4>
                            <p class="text-[var(--accent)] font-bold mt-1">R$ ${item.price.toFixed(2)}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-[var(--text-muted)] hover:text-red-400 transition-colors">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
                checkoutBtn.disabled = false;
            }
            
            // Total
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.textContent = `R$ ${total.toFixed(2)}`;
            
            // Salvar
            localStorage.setItem('vortex_cart', JSON.stringify(cart));
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            cart.push(product);
            renderCart();
            
            // Toast
            const toast = document.getElementById('toast');
            document.getElementById('toast-product').textContent = product.name;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('cart-overlay');
            
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
            
            if (drawer.classList.contains('open')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            alert(`✓ Compra realizada!\n\nTotal: R$ ${total.toFixed(2)}\n\nObrigado por apoiar o RED VORTEX!`);
            
            cart = [];
            renderCart();
            toggleCart();
        }

        // Fechar com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const drawer = document.getElementById('cart-drawer');
                if (drawer.classList.contains('open')) toggleCart();
            }
        });

        // Inicializar
        renderProducts();
        renderCart();
    </script>

</body>
</html>
